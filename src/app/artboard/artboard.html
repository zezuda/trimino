<svg
  #svg
  class="sheet"
  [attr.viewBox]="viewBox()"
  [attr.width]="size().width"
  [attr.height]="size().height"
  role="group"
  [attr.aria-label]="sheetLabel()"
  aria-describedby="artboard-help"
  (pointerdown)="onBackgroundDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
>
  @for (r of store.sheets(); track $index) {
    <rect class="paper" [attr.x]="r.x" [attr.y]="r.y" [attr.width]="r.width" [attr.height]="r.height" />
    @if (headers()[$index]; as h) {
      <text
        class="sheet-header"
        aria-hidden="true"
        [attr.x]="r.x + r.width / 2"
        [attr.y]="r.y + HEADER.baseline"
        [attr.font-size]="h.size"
        [style.font-family]="'&quot;' + HEADER_FONT_FAMILY + '&quot;, sans-serif'"
      >{{ h.text }}</text>
    }
    @if (store.sheetCount() > 1) {
      <text class="sheet-number" aria-hidden="true" [attr.x]="r.x - 8" [attr.y]="r.y + 18">{{ $index + 1 }}</text>
    }
  }

  @if (addSheetBox(); as a) {
    <g
      #addButton
      class="add-sheet"
      role="button"
      tabindex="0"
      (click)="addSheet(addButton)"
      (keydown.enter)="addSheet(addButton)"
      (keydown.space)="$event.preventDefault(); addSheet(addButton)"
    >
      <rect [attr.x]="a.x" [attr.y]="a.y" [attr.width]="a.width" [attr.height]="a.height" rx="8" />
      <text [attr.x]="a.x + a.width / 2" [attr.y]="a.y + a.height / 2">+ Přidat stránku</text>
    </g>
  }

  @for (p of store.placements(); track p.index) {
    @let piece = pieces()[p.index];
    @let isSelected = store.selection().has(p.index);
    <g
      class="piece"
      [class.selected]="isSelected"
      [class.overflow]="store.overflowing().has(p.index)"
      [attr.transform]="transform(p)"
      [attr.data-index]="p.index"
      tabindex="0"
      role="button"
      [attr.aria-label]="label(p)"
      [attr.aria-pressed]="isSelected"
      (pointerdown)="onPieceDown($event, p.index)"
      (focus)="onPieceFocus(p.index)"
      (keydown)="onKey($event)"
    >
      <!-- Only the piece is resized; the badge and the handle keep their size. -->
      <g [attr.transform]="'scale(' + p.scale + ')'">
        <image
          [attr.href]="piece.imageUrl"
          [attr.x]="piece.imageBox.x"
          [attr.y]="piece.imageBox.y"
          [attr.width]="piece.imageBox.width"
          [attr.height]="piece.imageBox.height"
          preserveAspectRatio="none"
        />
        <polygon class="outline" [attr.points]="localPoints(piece)" />
      </g>
      <text class="badge" aria-hidden="true" y="4">{{ p.index + 1 }}</text>
      @if (store.single() === p.index) {
        <line class="handle-arm" x1="0" y1="0" x2="0" [attr.y2]="-handleOffset(piece, p.scale)" />
        <circle
          class="handle"
          r="7"
          cx="0"
          [attr.cy]="-handleOffset(piece, p.scale)"
          (pointerdown)="onHandleDown($event, p.index)"
        >
          <title>Otočit</title>
        </circle>
      }
    </g>
  }

  @if (guides(); as g) {
    @if (g.sheet && g.vertical) {
      <line class="guide" [attr.x1]="g.sheet.x + g.sheet.width / 2" [attr.y1]="g.sheet.y" [attr.x2]="g.sheet.x + g.sheet.width / 2" [attr.y2]="g.sheet.y + g.sheet.height" />
    }
    @if (g.sheet && g.horizontal) {
      <line class="guide" [attr.x1]="g.sheet.x" [attr.y1]="g.sheet.y + g.sheet.height / 2" [attr.x2]="g.sheet.x + g.sheet.width" [attr.y2]="g.sheet.y + g.sheet.height / 2" />
    }
  }
  @if (marquee(); as m) {
    <rect class="marquee" [attr.x]="m.x" [attr.y]="m.y" [attr.width]="m.width" [attr.height]="m.height" />
  }
</svg>
<p id="artboard-help" class="visually-hidden">Šipky posun, R otočení o {{ kind.rotateStep }}°, plus a minus změna velikosti o 5 %, Ctrl+A vybrat vše, Ctrl+Z zpět, Ctrl+Y znovu.</p>
